version: "3.9"

networks:
  demo-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fournisseurs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - demo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fournisseurs"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-fournisseurs:
    build: ./mcp-fournisseurs
    networks:
      - demo-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  agent-metier:
    build: ./agent-metier
    networks:
      - demo-net
    depends_on:
      mcp-fournisseurs:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  agent-orchestrateur:
    build: ./agent-orchestrateur
    networks:
      - demo-net
    depends_on:
      agent-metier:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
