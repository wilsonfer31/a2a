spring:
  application:
    name: mcp-fournisseurs
  ai:
    mcp:
      server:
        name: mcp-fournisseurs
        version: 1.0.0
  datasource:
    url: jdbc:postgresql://postgres:5432/fournisseurs
    username: ${DB_USER:mcp_reader}
    password: ${DB_PASS:mcp_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
